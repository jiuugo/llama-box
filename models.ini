version = 1.5


; ================================================================
; GLOBAL DEFAULTS
; ================================================================

[*]
load-on-startup = false
n-gpu-layers    = all
fit             = off
parallel        = 1
flash-attn      = on
jinja           = true


; ================================================================
; QWEN 3.8 — 27B
; ================================================================

; ------------------------------------------------
; 80k context / Q8 KV / no MTP / Medium
; ------------------------------------------------

[qwen3.8-27b]

