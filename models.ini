version = 1.2


; ================================================================
; GLOBAL DEFAULTS
; ================================================================

[*]
load-on-startup = false
n-gpu-layers    = all
fit             = off
parallel        = 1
flash-attn      = on
jinja           = true


; ================================================================
; QWEN 3.8 — 27B
; ================================================================

; ------------------------------------------------
; 80k context / Q8 KV / no MTP / Medium
; ------------------------------------------------

[qwen3.8-27b]

model              = /models/Qwen3.8-27B-UD-Q3_K_XL/Qwen3.8-27B-UD-Q3_K_XL.gguf
no-mmproj          = true

ctx-size           = 80000
kv-unified         = true

batch-size         = 2048
ubatch-size        = 512

cache-type-k       = q8_0
cache-type-v       = q8_0

reasoning          = on
reasoning-effort   = medium
reasoning-preserve = true

temp               = 1.0
top-p              = 0.95
top-k              = 20
min-p              = 0.0
presence-penalty   = 0.0
repeat-penalty     = 1.0


